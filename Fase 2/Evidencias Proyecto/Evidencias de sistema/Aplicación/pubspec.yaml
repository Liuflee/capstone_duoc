name: frenos_cerna
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  crypto: ^3.0.7
  dart_sentencepiece_tokenizer: ^1.4.1
  flutter_onnxruntime: ^1.9.0
  path_provider: ^2.1.5
  whisper_ggml: ^2.9.0
  http: ^1.6.0
  record: ^7.1.2
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.5 # Conserva las ventas pendientes en el dispositivo.
  window_manager: ^0.6.0
  material_ui: ^1.11.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/ia/

dependency_overrides:
  nativeapi:
    path: third_party/nativeapi
  cnativeapi:
    path: third_party/cnativeapi
