name: frenos_cerna
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.5 # Conserva las ventas pendientes en el dispositivo.
  window_manager: ^0.6.0
  material_ui: ^1.11.0
  mobile_scanner: 7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  nativeapi:
    path: third_party/nativeapi
  cnativeapi:
    path: third_party/cnativeapi